version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow
      POSTGRES_DB: devflow
    ports:
      - "5433:5432"
    volumes:
      - devflow_pg_data:/var/lib/postgresql/data
volumes:
  devflow_pg_data:
